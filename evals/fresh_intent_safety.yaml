# A second, smaller set. Purpose: an honest check of evals/intent_safety.yaml.
#
# The prompts were written and adjusted while looking at messages that are now
# in the main set, so a perfect score there says little. These 20 messages were
# written afterwards, labelled with the same rules (see the top of
# intent_safety.yaml) BEFORE being run, then run once. Nothing was changed in
# the prompts or the labels after seeing the result.
#
# One label was changed later, for a different reason: f-book-03 ("reschedule my
# appointment") was UNKNOWN while the concierge could not reschedule. Once it
# could, rule I2 put rescheduling under BOOK_SERVICE, and the label followed.

